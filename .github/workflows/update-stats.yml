name: Update Stats SVG
permissions:
  contents: write
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats SVG
        run: |
          curl -s "https://github-readme-stats-sigma-brown-93.vercel.app/api?username=abdubakr77&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&bg_color=0d1117&title_color=58a6ff&text_color=8b949e&icon_color=1f6feb&border_color=30363d" > stats.svg
          curl -s "https://github-readme-stats-sigma-brown-93.vercel.app/api/top-langs/?username=abdubakr77&layout=compact&hide_border=true&langs_count=6&bg_color=0d1117&title_color=58a6ff&text_color=8b949e&border_color=30363d" > top-langs.svg
      - name: Verify SVGs are valid
        run: |
          for f in stats.svg top-langs.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "❌ $f is not a valid SVG (probably an error response):"
              cat "$f"
              exit 1
            fi
          done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stats SVG" && git push)
